services:
  web-ui:
    build:
      context: ../apps/web-ui
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ../apps/api
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - UPLOAD_DIR=/app/uploads
      - DATA_DIR=/app/data
      - DB_PATH=/app/data/app.db
      - EXPORT_DIR=/app/data/exports
      - AI_WORKER_URL=http://ai-worker:8000
      - VIDEO_ASSETS_DIR=/app/video-assets
      - VIDEO_WORKER_URL=http://video-worker:8100
    volumes:
      - uploads:/app/uploads
      - data:/app/data
      - video-assets:/app/video-assets
    depends_on:
      - ai-worker
    restart: unless-stopped

  video-worker:
    build: ../apps/video-worker
    ports:
      - "8100:8100"
    environment:
      - API_INTERNAL_CALLBACK_URL=http://api:4000/api/internal
      - PIPER_VOICES_DIR=/app/voices
      # GPU-decode long videos when scanning for scene changes (the only
      # part of analysis that scans the whole file frame-by-frame). Face/crop
      # detection samples a fixed handful of frames regardless of duration,
      # so it doesn't need this. Falls back to CPU decode automatically if
      # NVDEC isn't actually usable at runtime.
      - FFMPEG_HWACCEL=cuda
    volumes:
      - video-assets:/app/video-assets
      - piper-voices:/app/voices
      - whisper-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ai-worker:
    build: ../apps/ai-worker
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=mistral:7b-instruct
    volumes:
      - uploads:/app/uploads
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11435:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  uploads:
  data:
  ollama:
  video-assets:
  piper-voices:
  whisper-cache:
